<h1>동일 B1 초기장의 OLD/FIX 과정 진단</h1><p>그림은 파일에서 직접 표시됩니다. 시간·임계값의 점수를 평균하지 않습니다.</p>
<figure><h2>그림 1. 동일 초기장의 예보시간별 실제 약한 강수 검출</h2><img src="figures/whole_domain_weak_hits.png" alt="그림 1. 동일 초기장의 예보시간별 실제 약한 강수 검출"><figcaption>실제 약한 관측 구간은 0.1≤RN1&lt;1 mm, 검출은 예측≥0.1 mm다. 시간이나 임계값을 평균하지 않는다.</figcaption></figure>
<figure><h2>그림 2. 실패·보호 집단과 인접 오경보의 위치</h2><img src="figures/protected_failure_map.png" alt="그림 2. 실패·보호 집단과 인접 오경보의 위치"><figcaption>OA와 XA 소실 집단을 구분한다. 신규·해소 오경보 33·30은 X→A 비교다. 화살표는 공간 이웃 대응이며 강수계 이동 경로가 아니다.</figcaption></figure>
<figure><h2>그림 3. 하층 비 혼합비의 원래 양·남은 양과 지점별 차이</h2><img src="figures/qrain_lower_layer_plus1h.png" alt="그림 3. 하층 비 혼합비의 원래 양·남은 양과 지점별 차이"><figcaption>0–1 km 모형층 산술평균 뒤 공간 보간한 진단이다. 질량 평균이 아니며 중앙값의 차이와 차이의 중앙값을 구분한다.</figcaption></figure>
<figure><h2>그림 4. 실제 호출 경계의 고정 모형층별 과정 비교</h2><img src="native_figures/two_point_process_components.png" alt="그림 4. 실제 호출 경계의 고정 모형층별 과정 비교"><figcaption>RN1_10942의 +2시간과 RN1_12299의 +5시간이다. 호출 내부 L과 그 분해항을 중복 합산하지 않는다. E는 호출 사이 전체 순변화이며 순수 이류가 아니다.</figcaption></figure>
<p>시간·임계값별 전체 수치는 <a href="tables/FULL_SCORES.md">부속 표</a>에 있습니다.</p></html>
